  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(estado)); } catch(e) {}
  const dot = document.getElementById('saved-dot');
  const txt = document.getElementById('stat-saved');
  dot.classList.add('saving');
  txt.textContent = 'salvando...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    dot.classList.remove('saving');
    txt.textContent = 'salvo';
  }, 250);
}

function hoje() { return new Date().toISOString().slice(0,10); }

function formatarData() {
  const d = new Date(estado.data + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
}

function getItem(nome) {
  if (!estado.itens) estado.itens = {};
  if (!estado.itens[nome]) estado.itens[nome] = { real: '', obs: '' };
  return estado.itens[nome];
}

function atualizarStats() {
  const total = PRODUTOS.length;
  let contados = 0;
  PRODUTOS.forEach(p => {
    const it = estado.itens && estado.itens[p.nome];
    if (it && it.real !== '' && it.real !== undefined) contados++;
  });
  document.getElementById('stat-contados').textContent = contados;
  document.getElementById('stat-total').textContent = total;
  const pct = total ? (contados / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function renderChips() {
  const cats = ['TODAS', ...Array.from(new Set(PRODUTOS.map(p => p.categoria))).sort()];
  document.getElementById('chips').innerHTML = cats.map(c => {
    const ico = CAT_ICONS[c] || '📦';
    return '<div class="chip ' + (c === filtroCategoria ? 'active' : '') + '" onclick="setFiltro(\'' + c + '\')"><span class="chip-icon">' + ico + '</span>' + c + '</div>';
  }).join('');
}

function setFiltro(c) {
  filtroCategoria = c;
  renderChips();
  renderLista();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderLista() {
  const el = document.getElementById('lista');
  const q = busca.toLowerCase().trim();
  const lista = PRODUTOS.filter(p => {
    if (filtroCategoria !== 'TODAS' && p.categoria !== filtroCategoria) return false;
    if (q && !p.nome.toLowerCase().includes(q)) return false;
    return true;
  });
  if (lista.length === 0) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>Nenhum produto encontrado</div>';
    return;
  }
  const html = lista.map(p => {
    const it = getItem(p.nome);
    const temValor = it.real !== '' && it.real !== undefined;
    let grauBadge = '';
    if (p.grau === 'S') {
      grauBadge = '<span class="badge grau-s">⭐ Sensível</span>';
    } else if (p.grau) {
      grauBadge = '<span class="badge grau">Grau ' + escHtml(p.grau) + '</span>';
    }
    const catIcon = CAT_ICONS[p.categoria] || '📦';
    const obsText = p.obs ? '<div class="obs">📌 ' + escHtml(p.obs) + '</div>' : '';
    const nomeEnc = encodeURIComponent(p.nome);
    return '<div class="card ' + (temValor ? 'counted' : '') + '">' +
      '<div class="card-info">' +
        '<div class="nome">' + escHtml(p.nome) + '</div>' +
        '<div class="badges"><span class="badge cat">' + catIcon + ' ' + escHtml(p.categoria) + '</span>' + grauBadge + '</div>' +
        obsText +
        '<input class="obs-input" type="text" value="' + escHtml(it.obs || '') + '" oninput="setValor(\'' + nomeEnc + '\',\'obs\',this.value)" placeholder="Observação (opcional)">' +
      '</div>' +
      '<div class="qtd-wrap">' +
        '<input class="qtd-input ' + (temValor ? 'has-value' : '') + '" type="number" inputmode="numeric" pattern="[0-9]*" value="' + escHtml(it.real) + '" oninput="setValor(\'' + nomeEnc + '\',\'real\',this.value)" placeholder="0">' +
      '</div>' +
    '</div>';
  }).join('');
  el.innerHTML = html;
}

function setValor(nomeEnc, campo, valor) {
  const nome = decodeURIComponent(nomeEnc);
  const it = getItem(nome);
  it[campo] = valor;
  salvar();
  if (campo === 'real') atualizarCard(nome);
  atualizarStats();
}

function atualizarCard(nome) {
  const it = getItem(nome);
  const temValor = it.real !== '' && it.real !== undefined;
  const inputs = document.querySelectorAll('.card .qtd-input');
  inputs.forEach(input => {
    const card = input.closest('.card');
    const nomeCard = card.querySelector('.nome').textContent;
    if (nomeCard === nome) {
      card.classList.toggle('counted', temValor);
      input.classList.toggle('has-value', temValor);
    }
  });
}

document.getElementById('busca').addEventListener('input', e => { busca = e.target.value; renderLista(); });

function resetar() {
  if (!confirm('Apagar TODA a contagem atual? Esta ação não pode ser desfeita.')) return;
  estado = { data: hoje(), itens: {} };
  salvar();
  renderLista();
  atualizarStats();
  atualizarData();
  mostrarToast('✓ Contagem zerada');
}

function exportar() {
  const NL = String.fromCharCode(10);
  let csv = 'NOME;CATEGORIA;ESTOQUE REAL;OBS' + NL;
  PRODUTOS.forEach(p => {
    const it = (estado.itens && estado.itens[p.nome]) || {};
    const r = (it.real === '' || it.real === undefined) ? '' : it.real;
    const obs = (it.obs || '').replace(/[;\r\n]/g, ' ');
    csv += '"' + p.nome + '";"' + p.categoria + '";' + r + ';"' + obs + '"' + NL;
  });
  baixarArquivo(csv, 'contagem_' + estado.data + '.csv');
  mostrarToast('✓ CSV exportado');
}

function baixarArquivo(conteudo, nome) {
  const blob = new Blob(['﻿' + conteudo], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

function atualizarData() {
  document.getElementById('data-atual').textContent = formatarData();
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function detectarIOS() {
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua);
  const isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone) {
    document.getElementById('install-prompt').style.display = 'flex';
  }
}

renderChips();
renderLista();
atualizarStats();
atualizarData();
detectarIOS();
</script>
</body>
</html>
